# Dependabot version updates, monthly and grouped. Whoever owns this site merges the monthly pull request (name them in
# the site's own README, the one new-website writes, or in SETUP.md); if nobody will, delete this file: security updates stay on without it.
# The `ignore` rules below also apply to Dependabot's security pull requests (GitHub's options reference marks `ignore` as
# affecting both), so a flaw fixed only in a held major shows in `npm audit` but may not arrive as a pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Same ignore rules as the toolkit's own .github/dependabot.yml and the starter's copy of this file; change them together.
    ignore:
      # Tracks the Node major in .nvmrc and ci.yml; bump them together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @astrojs/check 0.9.x peers typescript ^5 || ^6; lift this once it accepts 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
