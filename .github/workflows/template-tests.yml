name: template-tests
# Runs the scaffolded Astro template's own Playwright suite (every spec in its tests/
# folder) against a production build, so a change to
# the template can't silently ship a regression. In particular it exercises the seo.spec
# indexability guard (open robots.txt + llms.txt present), which the repo's only other
# workflow (`clean`, a PII/secrets scan) never touches. CI is set by Actions, so the
# Playwright config starts its own preview server (no reuseExistingServer).
#
# It starts on every pull request and every push to main, but its test jobs run only when
# a change touches the paths in the `changes` job below; otherwise they are skipped. The
# last job, `template-tests-ok`, is the one check main's ruleset requires: a workflow left
# out by a `paths:` filter never reports, and a required check that never reports blocks
# every merge, while a job skipped by its `if:` counts as passed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Same events and concurrency group expression as clean.yml; the reasons are written
# there. The workflow name in the group keeps the two workflows' runs apart.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: skills/new-website/templates/astro

jobs:
  # Whether this change touches what the jobs below test. A run started by hand tests
  # everything. On a pull request the change is the branch since it left main, as a
  # `paths:` filter reads it; on main it is the push.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # --no-renames: a moved file counts at both its old and its new path, so moving a
          # tested file out of these folders still runs the tests. core.quotePath=false: git
          # lists an accented name as written, not quoted and escaped; a name it still quotes
          # (one with a quote mark or a control character) runs the tests. A diff that fails
          # stops this step, and the last job then fails too.
          all=false files=
          case "$EVENT" in
            pull_request) files="$(git -c core.quotePath=false diff --no-renames --name-only "$PR_BASE...$PR_HEAD")" ;;
            push)
              # A push with no commit before it (a new branch) has nothing to compare with.
              if [ -z "${PUSH_BEFORE//0/}" ]; then all=true; else files="$(git -c core.quotePath=false diff --no-renames --name-only "$PUSH_BEFORE" "$PUSH_AFTER")"; fi ;;
            *) all=true ;;
          esac
          run=$all n=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            n=$((n + 1))
            case "$f" in
              # whats-new.sh: verify-windows runs the recovery command it prints.
              skills/new-website/templates/astro/*|skills/website-scorecard/*|skills/website-contact-form/*|skills/website-hero-carousel/*|skills/website-brand-kit/*|skills/website-tagline/*|scripts/whats-new.sh|scripts/test_served_build.sh|.github/workflows/template-tests.yml) run=true ;;
              \"*) run=true ;;
            esac
          done <<EOF
          $files
          EOF
          echo "run=$run" >>"$GITHUB_OUTPUT"
          if [ "$all" = true ]; then echo "$EVENT: nothing to compare with, so every test job runs"
          else echo "$EVENT: $n changed path(s); template tests run: $run"; fi

  playwright:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The template's publish classifier. It needs no build, no browser and no
      # network, so it runs first and fails within a minute or so. In THIS repo it runs here,
      # on the macOS leg of prepare-any-shell, and in verify-windows, whose pushes go through
      # a copied site's pre-push hook (there its real-git half skips itself, on Git Bash). The
      # copy wired into the template's own ci.yml and pre-push hook otherwise executes inside a
      # scaffolded site, never here — so without these, a regression in scripts/ship.sh would
      # reach recipients with CI green.
      - name: Publish classifier (scripts/ship.sh)
        run: bash tests/check_ship_push.sh
      - uses: actions/setup-node@v7
        with:
          # The template pins its Node version; build/test on the same one Cloudflare uses.
          node-version-file: skills/new-website/templates/astro/.nvmrc
          check-latest: true  # a cached older Node of that major is not enough: engines needs its security release
      - name: Install dependencies
        # The template's own package-lock.json IS committed (since 2026-07-09) — npm ci
        # for a reproducible install against that lockfile. This exercises the same
        # package.json/lockfile pinning as the "copy package.json and run npm install"
        # alternate path in templates/astro/README.md (conceptually, not literally — that
        # path runs `npm install`, this runs `npm ci`), NOT the primary npm-create-astro@latest
        # onboarding flow real recipients follow — see docs/reviews/REVIEW-plan-2026-07-16-astro7-upgrade-r1.md
        # for that known gap (tracked as a separate follow-up, not fixed by this change).
        run: npm ci --no-audit --no-fund
      # The template is a subfolder of this repo, the way a site can sit inside a bigger
      # repo. The install's "prepare" script must then leave this repo's git hooks alone:
      # pointed at a scripts/hooks this repo does not have, git runs no hooks at all.
      - name: The install left this repo's git hooks alone
        run: |
          v="$(git config --local --get core.hooksPath || true)"
          [ -z "$v" ] || { echo "npm ci set core.hooksPath=$v in the enclosing repo"; exit 1; }
      # Builds the site four ways and reads the HTML. The starter ships with analytics off
      # (USE_ANALYTICS = false): no tag in any build, the live one included, and no analytics
      # host in public/_headers. The full suite (the last step) builds once and never as the
      # live site.
      - name: Analytics off in every build, as shipped (src/config.ts)
        run: bash tests/check_analytics_gate.sh
      # The same four builds with analytics switched on (USE_ANALYTICS = true, the host added
      # to script-src and connect-src in public/_headers): the tag and the stub on the
      # production build only. Both files are put back afterwards, so the steps below run
      # on the default.
      - name: Analytics switched on (src/config.ts and public/_headers changed for this step only)
        run: |
          # The host as the gate reads it: either quote, no trailing slash.
          host="$(sed -nE "s/^[[:space:]]*scriptHost:[[:space:]]*['\"]([^'\"]*)['\"].*/\1/p" src/config.ts)"
          host="${host%/}"
          [ -n "$host" ] || { echo "no scriptHost: '<host>' line in src/config.ts that the gate can read"; exit 1; }
          # The starter ships with analytics off; the step above tested that state.
          grep -q "^export const USE_ANALYTICS = false;" src/config.ts || { echo "the starter must ship USE_ANALYTICS = false"; exit 1; }
          sed -i "s/^export const USE_ANALYTICS = false;/export const USE_ANALYTICS = true;/" src/config.ts
          grep -q "^export const USE_ANALYTICS = true;" src/config.ts
          # The host as one more token at the end of script-src and connect-src, on the CSP
          # line only. script-src-elem does not match: the name must be followed by a space.
          # The gate below checks that the host is a whole token in both.
          host="$host" perl -pi -e 'if (/^\s*Content-Security-Policy:/) { s/(\bscript-src [^;]*)/$1 $ENV{host}/; s/(\bconnect-src [^;]*)/$1 $ENV{host}/ }' public/_headers
          npm run check
          bash tests/check_analytics_gate.sh
          git checkout -- src/config.ts public/_headers
      # The same four builds in server mode (USE_ANALYTICS = true, ANALYTICS.mode = 'server'):
      # no script in any, email links to /go/email on the live build only; _headers needs no
      # analytics host. config.ts is put back afterwards, so the suite below runs on the default.
      - name: Analytics in server mode (src/config.ts switched for this step only)
        run: |
          sed -i "s/^export const USE_ANALYTICS = false;/export const USE_ANALYTICS = true;/" src/config.ts
          grep -q "^export const USE_ANALYTICS = true;" src/config.ts
          sed -i "s/^  mode: 'script' as/  mode: 'server' as/" src/config.ts
          grep -q "^  mode: 'server' as" src/config.ts
          npm run check
          bash tests/check_analytics_gate.sh
          git checkout -- src/config.ts
      # functions/go/email.ts answers 400 to a subject over 200 characters, so EmailLink.astro
      # fails the build instead: the owner learns it from the build, not from a visitor's
      # broken click on the live site. A preview build (no CF_PAGES_BRANCH) must fail too, and
      # script mode, where the link is a plain mailto:, must still build. A throwaway page
      # carries the link; it and config.ts are put back afterwards.
      - name: Server mode refuses an email subject over 200 characters at build time
        run: |
          sed -i "s/^export const USE_ANALYTICS = false;/export const USE_ANALYTICS = true;/" src/config.ts
          grep -q "^export const USE_ANALYTICS = true;" src/config.ts
          page=src/pages/subject-length-check.astro
          out="$RUNNER_TEMP/subject-check"
          # subject_page <length>: the page, with one email link whose subject is that long.
          subject_page() {
            printf -- "---\nimport EmailLink from '../components/EmailLink.astro';\n---\n<EmailLink address=\"hello@example.com\" subject=\"%s\" />\n" "$(head -c "$1" /dev/zero | tr '\0' a)" > "$page"
          }
          build() { env -u CF_PAGES_BRANCH ./node_modules/.bin/astro build --outDir "$out" > "$out.log" 2>&1; }
          # Script mode: 201 characters build.
          subject_page 201
          build || { tail -n 20 "$out.log"; echo "script mode must build with a 201-character subject"; exit 1; }
          sed -i "s/^  mode: 'script' as/  mode: 'server' as/" src/config.ts
          grep -q "^  mode: 'server' as" src/config.ts
          # Server mode: 200 characters build; 201 fail, with EmailLink's message.
          subject_page 200
          build || { tail -n 20 "$out.log"; echo "server mode must build with a 200-character subject"; exit 1; }
          subject_page 201
          if build; then
            echo "server mode built with a 201-character subject; EmailLink.astro must fail the build"; exit 1
          fi
          grep -q "is 201 characters; server mode allows 200" "$out.log" || { tail -n 20 "$out.log"; echo "the build failed, but not with EmailLink's message"; exit 1; }
          rm "$page"
          git checkout -- src/config.ts
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # Email links on the live build as shipped: no tracker there, and a click still asks
      # the browser to open the mail program. The suite below covers the preview build, with
      # and without a stand-in tracker.
      - name: Email links on the live build, analytics off as shipped
        run: |
          prod="$(sed -nE "s/^export const PROD_BRANCH = ['\"]([^'\"]*)['\"];?.*/\1/p" src/config.ts)"
          [ -n "$prod" ] || { echo "no PROD_BRANCH line in src/config.ts"; exit 1; }
          CF_PAGES_BRANCH="$prod" npx playwright test tests/email.spec.ts
      - name: Run template test suite
        run: npm test
      # The served-build spec in fixed setups: it must fail when the server or dist/ holds
      # another build's id, which a normal run never shows.
      - name: The served-build spec fails on another build's id (scripts/test_served_build.sh)
        run: bash ../../../../scripts/test_served_build.sh

  # "prepare" runs on every `npm install`, through the shell npm hands scripts to: by default
  # sh on Linux and macOS, cmd.exe on Windows. The line it used to be was sh syntax, and no
  # check here ran it on Windows. So this runs a real install on all three: in a site that is
  # the root of its repo, in one kept in a subfolder of a bigger repo, and in a folder with
  # no repo around it, then reads back what git was told. The sites carry the starter's
  # package.json without its packages: "prepare" needs none of them, and the install then
  # takes a second.
  prepare-any-shell:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: skills/new-website/templates/astro/.nvmrc
          check-latest: true  # a cached older Node of that major is not enough: engines needs its security release
      - name: Three folders from the starter (a repo's root, a subfolder of a bigger repo, no repo)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          T="$GITHUB_WORKSPACE/skills/new-website/templates/astro"
          for site in root-site big/apps/site plain; do
            mkdir -p "$site/scripts"
            cp "$T/package.json" "$site/" && cp "$T/scripts/wire-hooks.mjs" "$site/scripts/"
            (cd "$site" && npm pkg delete dependencies devDependencies)
          done
          git init -q root-site && git init -q big
          # Which shell npm hands a script line to here, measured: cmd.exe puts its own path in
          # place of %ComSpec%, sh prints the word as written. A Windows leg whose npm used sh
          # would pass the checks below for the wrong reason.
          mkdir probe && (cd probe && npm init -y >/dev/null && npm pkg set scripts.probe='echo %ComSpec%')
          probe="$(cd probe && npm run --silent probe)"; echo "npm's script shell, given 'echo %ComSpec%', says: $probe"
          case "$RUNNER_OS:$probe" in
            Windows:*%*) echo "::error::on Windows npm did not hand the script to cmd.exe"; exit 1 ;;
            Windows:*cmd.exe*|Linux:%ComSpec%|macOS:%ComSpec%) ;;
            *) echo "::error::npm's script shell gave an answer this job does not know"; exit 1 ;;
          esac
      # The installs name no `shell:`, so each runs from the runner's default one: PowerShell
      # on Windows.
      - name: npm install in the site that is the root of its repo
        working-directory: ${{ runner.temp }}/root-site
        run: npm install --no-audit --no-fund
      - name: npm install in the site kept in a subfolder
        working-directory: ${{ runner.temp }}/big/apps/site
        run: npm install --no-audit --no-fund
      # A git hook that runs the install can hand it GIT_DIR; see scripts/wire-hooks.mjs.
      - name: The same install, with the GIT_DIR a git hook hands down
        working-directory: ${{ runner.temp }}/big/apps/site
        env:
          GIT_DIR: ${{ runner.temp }}/big/.git
        run: npm install --no-audit --no-fund
      - name: npm install in a folder with no repo around it
        working-directory: ${{ runner.temp }}/plain
        run: npm install --no-audit --no-fund
      - name: The root site's hook is wired, the bigger repo's hooks are left alone
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          root="$(git -C root-site config --local --get core.hooksPath || true)"
          big="$(git -C big config --local --get core.hooksPath || true)"
          echo "root-site: core.hooksPath=${root:-unset}, big: core.hooksPath=${big:-unset}"
          [ "$root" = scripts/hooks ] || { echo "::error::the install did not wire the site at its repo's root"; exit 1; }
          [ -z "$big" ] || { echo "::error::an install in a subfolder set core.hooksPath=$big in the bigger repo"; exit 1; }
      # scripts/ship.sh on the Mac's own bash 3.2, /bin/bash, the only place it is: there a stop
      # noted as the push pipeline ends resets that pipeline's status (case S10 (e) of
      # tests/check_ship_push.sh). The playwright job runs the same file on Linux, where the
      # case skips, so without this step it would first run in a site's pre-push gate.
      # SHIP_TEST_REQUIRE_BASH32 makes a skip of it fail here. /bin first on PATH, so every
      # case runs ship.sh on that bash, as a Mac's `npm run ship` does without Homebrew's.
      - name: Publish script on the Mac's bash 3.2 (tests/check_ship_push.sh)
        if: runner.os == 'macOS'
        shell: bash
        env:
          SHIP_TEST_REQUIRE_BASH32: 1
        run: |
          PATH="/bin:$PATH"
          echo "bash for every case: $(command -v bash), $(bash -c 'echo "$BASH_VERSION"')"
          /bin/bash tests/check_ship_push.sh

  # scripts/verify.mjs has a Windows-only branch: started directly (the pre-push hook), it finds
  # npm on PATH, which on Windows is npm.cmd, and Node starts a .cmd only through a shell; run as
  # `npm run verify`, it takes npm's own entry from npm_execpath, here a C:\ path with
  # backslashes. Nothing else exercises either. This builds a site from the starter at the root
  # of its own repo, so the install wires the hook, and runs verify both ways, then pushes
  # through the hook: a green change goes through, a tone violation is refused.
  verify-windows:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: skills/new-website/templates/astro/.nvmrc
          check-latest: true  # a cached older Node of that major is not enough: engines needs its security release
      - name: A site from the starter, at the root of its own repo, with a bare origin
        shell: bash
        run: |
          S="$RUNNER_TEMP/site"
          # Absolute: this workflow's default working-directory is the template folder.
          cp -r "$GITHUB_WORKSPACE/skills/new-website/templates/astro" "$S"
          # Git for Windows checks text out with CRLF. Its own bash runs a CRLF hook (this job
          # passed on one before), but WSL's or a container's sh stops at the first `set -e`,
          # so the template's .gitattributes keeps the hook and shell scripts LF.
          file "$S/scripts/hooks/pre-push" "$S/tests/check_ship_push.sh" || true
          # Node reads the bytes: a CR handed to grep through Git Bash flagged LF files as CRLF.
          node -e '
            const fs = require("fs"), path = require("path"), bad = [], seen = [];
            (function walk(d) {
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                const p = path.join(d, e.name);
                if (e.isDirectory()) { if (e.name !== "node_modules") walk(p); }
                else if (e.name.endsWith(".sh") || p.endsWith(path.join("hooks", "pre-push"))) {
                  seen.push(p); if (fs.readFileSync(p).includes(13)) bad.push(p);
                }
              }
            })(process.argv[1]);
            // A copy without the hook or any .sh would pass with nothing checked.
            if (!seen.some((p) => p.endsWith("pre-push")) || !seen.some((p) => p.endsWith(".sh"))) {
              console.log("::error::the copied site has no hook or no .sh to check"); process.exit(1);
            }
            if (bad.length) { console.log("::error::checked out with CRLF line endings: " + bad.join(" ")); process.exit(1); }
            console.log("line endings: LF in the hook and all " + seen.filter((p) => p.endsWith(".sh")).length + " .sh files");
          ' "$S"
          cd "$S"
          git init -q
          git config user.name ci && git config user.email ci@example.invalid
          git add -A && git commit -qm "site"
          git init -q --bare "$RUNNER_TEMP/origin.git"
          git remote add origin "$RUNNER_TEMP/origin.git"
          git push -q origin HEAD:refs/heads/main
      # The default shell, PowerShell, as a Windows user would run these.
      - name: npm ci (its prepare script wires the pre-push hook)
        working-directory: ${{ runner.temp }}/site
        run: npm ci --no-audit --no-fund
      - name: Playwright's browser
        working-directory: ${{ runner.temp }}/site
        run: npx playwright install chromium
      # VERIFY_TRACE=1 makes verify.mjs name the way it started npm, so each step can prove its branch.
      - name: verify.mjs started directly (npm.cmd from PATH, through a shell; first run installs)
        working-directory: ${{ runner.temp }}/site
        shell: bash
        env:
          VERIFY_TRACE: '1'
        run: |
          node scripts/verify.mjs 2>&1 | tee verify1.log
          grep -q "verify: npm from PATH (through a shell)" verify1.log
          grep -q "verify: all green" verify1.log
          # Node deprecates an args array with shell: true (DEP0190); verify.mjs passes one string.
          if grep -q "DEP0190" verify1.log; then echo "::error::verify.mjs printed Node's DEP0190 warning"; exit 1; fi
      - name: npm run verify (npm's own npm-cli.js under a C:\ path); the second run does not reinstall
        working-directory: ${{ runner.temp }}/site
        shell: bash
        env:
          VERIFY_TRACE: '1'
        run: |
          npm run verify 2>&1 | tee verify2.log
          grep -q "verify: npm via npm_execpath (npm-cli.js)" verify2.log
          grep -q "verify: all green" verify2.log
          if grep -q "installing the exact packages" verify2.log; then echo "::error::the second run reinstalled"; exit 1; fi
      - name: The pre-push hook runs verify (a green push goes through, a red one is refused)
        working-directory: ${{ runner.temp }}/site
        shell: bash
        run: |
          [ "$(git config --get core.hooksPath)" = scripts/hooks ] || { echo "::error::npm ci did not wire the hook"; exit 1; }
          base="$(git rev-parse HEAD)"
          git switch -q -c content/green
          git commit -q --allow-empty -m "green"
          git push origin content/green 2>&1 | tee push-green.log
          grep -q "pre-push gate passed" push-green.log
          git ls-remote --exit-code origin refs/heads/content/green >/dev/null
          git switch -q -c content/red "$base"
          sed -i 's/This starter page exists/This seamless starter page exists/' src/pages/index.astro
          git diff --quiet && { echo "::error::the tone violation was not written"; exit 1; }
          git commit -qam "red"
          if git push origin content/red 2>&1 | tee push-red.log; then echo "::error::a push with a tone violation went through"; exit 1; fi
          grep -q "verify: npm test failed" push-red.log
          if git ls-remote --exit-code origin refs/heads/content/red >/dev/null; then echo "::error::the red branch reached origin"; exit 1; fi
      # whats-new.sh tells a Windows working copy made before .gitattributes how to get LF copies
      # back. Run that exact command (read from whats-new.sh, not retyped) in Git Bash: it needs
      # `xargs -0` there, and paths with spaces.
      - name: whats-new's CRLF recovery command works in Git Bash
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          line="$(grep -A1 'templates/astro/.gitattributes)' "$GITHUB_WORKSPACE/scripts/whats-new.sh" | tail -1 | sed 's/ ;;$//')"
          cmd="$(bash -c "$line" | grep -o '`[^`]*`' | tr -d '`')"
          case "$cmd" in "git ls-files "*) echo "command: $cmd" ;; *) echo "::error::no recovery command found in whats-new.sh"; exit 1 ;; esac
          crs() { node -e 'let n = 0; for (const f of process.argv.slice(1)) if (require("fs").readFileSync(f).includes(13)) n++; console.log(n)' "$@"; }
          mkdir crlf-fix && cd crlf-fix && git init -q && git config user.name ci && git config user.email ci@example.invalid
          mkdir -p scripts/hooks tests "my dir"
          printf '#!/bin/sh\nset -e\n' >scripts/hooks/pre-push; printf 'echo a\n' >tests/x.sh; printf 'echo b\n' >"my dir/sp ace.sh"
          git -c core.autocrlf=false add -A && git -c core.autocrlf=false commit -qm lf
          # A working copy as Git for Windows writes it by default: CRLF, with a clean status.
          git config core.autocrlf true
          git ls-files -z | xargs -0 rm -f && git checkout -- .
          before="$(crs scripts/hooks/pre-push tests/x.sh "my dir/sp ace.sh")"
          [ "$before" = 3 ] || { echo "::error::the setup did not produce CRLF copies ($before of 3)"; exit 1; }
          cp "$GITHUB_WORKSPACE/skills/new-website/templates/astro/.gitattributes" . && git add .gitattributes && git commit -qm attrs
          eval "$cmd"
          after="$(crs scripts/hooks/pre-push tests/x.sh "my dir/sp ace.sh")"
          [ "$after" = 0 ] || { echo "::error::$after file(s) still CRLF after the recovery command"; exit 1; }
          echo "recovery command: 3 CRLF files, 0 after"

  # The website-scorecard skill ships three files that live in a SITE, never in the
  # starter, so the job above does not run them. This builds a site from the starter,
  # installs the skill the way its SKILL.md §2 says, writes a card and runs the suite
  # with it. A starter change that breaks those files (they lean on src/config.ts, the
  # Base layout, the Playwright config and its JSON report) turns red here.
  scorecard-skill:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: skills/new-website/templates/astro/.nvmrc
          check-latest: true  # a cached older Node of that major is not enough: engines needs its security release
      - name: A site from the starter, with the skill installed
        working-directory: ${{ runner.temp }}
        run: |
          cp -R "$GITHUB_WORKSPACE/skills/new-website/templates/astro" site && cd site
          K="$GITHUB_WORKSPACE/skills/website-scorecard/templates"
          cp "$K/scorecard.mjs" scripts/ && cp "$K/Scorecard.astro" src/components/ && cp "$K/scorecard.spec.ts" tests/
          npm pkg set scripts.scorecard="node scripts/scorecard.mjs"
          sed -i "s|const PAGE = '';|const PAGE = '/';|" tests/scorecard.spec.ts
          sed -i "s|^import { SITE } from '../config';|import { SITE } from '../config';\nimport Scorecard from '../components/Scorecard.astro';|" src/pages/index.astro
          sed -i 's|^</Base>|  <div class="wrap"><Scorecard /></div>\n</Base>|' src/pages/index.astro
          # One check per line: in "a && b" a failing a does not stop the step.
          grep -q "const PAGE = '/';" tests/scorecard.spec.ts
          grep -q '<Scorecard />' src/pages/index.astro
          grep -q "import Scorecard" src/pages/index.astro
          printf 'node_modules\ndist\n.astro\ntest-results\n' > .gitignore
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          git init -q && git config user.name ci && git config user.email ci@example.invalid
          git add -A && git commit -q -m "a site with the scorecard skill"
      - name: Type check, write the card, run the suite with it
        working-directory: ${{ runner.temp }}/site
        run: |
          npm run check
          npm run scorecard
          git add scorecard.json && git commit -q -m "scorecard"
          npm run scorecard -- --lighthouse 90,91,92,93 --date 2026-01-01
          git add scorecard.json && git commit -q -m "scores"
          npm test
          grep -q 'data-state="current"' dist/index.html
      # The card's totals against Playwright's own summary, from a second run with another
      # reporter: the script reads the JSON report, this reads the lines Playwright
      # prints. So a change in the JSON report's shape that made the script miscount
      # turns red here. The card leaves out its own spec, whose tests all sit that run out.
      - name: The card's totals are Playwright's totals
        working-directory: ${{ runner.temp }}/site
        run: |
          out="$(SCORECARD_RUN=1 CI= npx playwright test --reporter=line 2>&1 | tail -n 8)"
          echo "$out"
          passed="$(printf '%s\n' "$out" | sed -n 's/^ *\([0-9][0-9]*\) passed.*/\1/p')"
          skipped="$(printf '%s\n' "$out" | sed -n 's/^ *\([0-9][0-9]*\) skipped.*/\1/p')"
          # How many tests the card's own spec has, asked of Playwright rather than counted
          # in the source, so reformatting that file cannot change the answer.
          own="$(npx playwright test tests/scorecard.spec.ts --list 2>&1 | sed -n 's/^Total: \([0-9][0-9]*\) tests\{0,1\} in .*/\1/p')"
          node -e '
            const card = JSON.parse(require("fs").readFileSync("scorecard.json", "utf8"));
            const [passed, skipped, own] = process.argv.slice(1).map(Number);
            const line = `card: ${card.passed} passed, ${card.skipped} skipped. Playwright: ${passed} passed, ${skipped} skipped, ${own} of them the tests of the card itself.`;
            if (!(passed > 0) || !(own > 0) || card.passed !== passed || card.skipped !== skipped - own) { console.error("::error::" + line); process.exit(1); }
            console.log("agree. " + line);
          ' "$passed" "$skipped" "$own"
      # The three ways a run has to be refused, each against a real Playwright report:
      # the script's own arithmetic is pinned in its spec, this pins what Playwright
      # hands it. Each case is committed (the script wants a clean tree), must make
      # `npm run scorecard` fail, must leave scorecard.json alone, and is then undone.
      - name: A red run writes no card
        working-directory: ${{ runner.temp }}/site
        run: |
          before="$(sha256sum scorecard.json)"
          refused() {
            git add -A && git commit -q -m "$1"
            if npm run scorecard; then echo "::error::$1: the run was accepted"; exit 1; fi
            [ "$(sha256sum scorecard.json)" = "$before" ] || { echo "::error::$1: scorecard.json changed"; exit 1; }
            git reset -q --hard HEAD~1
          }
          printf 'this is not typescript (((\n' > tests/broken.spec.ts
          refused "a spec file that cannot load"
          sed -i '0,/^  test(/s//  test.only(/' tests/links.spec.ts && grep -q '^  test.only(' tests/links.spec.ts
          refused "a stray test.only"
          sed -i 's|<p>Contact:|<p>FIXME</p><p>Contact:|' src/pages/index.astro && grep -q 'FIXME' src/pages/index.astro
          refused "a failing test"
          [ -z "$(git status --porcelain)" ]

  # The website-contact-form skill, like the scorecard, ships files that live in a SITE.
  # This builds a site from the starter, installs the skill the way its SKILL.md §2 says
  # (the component, its words, the script, the test, the form on a page), and runs the
  # type check and the whole suite. A second form, in German, sits on the starter's
  # German page with its own copy of the spec, so the German texts go through the tone
  # rules and the page checks too. The German form carries fields of the page's own and
  # a hint (the skill's "Adding fields"), with its own page spec, so a form with no slot
  # used and one with all of them both run. No mail program opens: the spec reads the
  # mailto: link the button asks the browser to open.
  contact-form-skill:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: skills/new-website/templates/astro/.nvmrc
          check-latest: true  # a cached older Node of that major is not enough: engines needs its security release
      - name: A site from the starter, with the skill installed
        working-directory: ${{ runner.temp }}
        run: |
          cp -R "$GITHUB_WORKSPACE/skills/new-website/templates/astro" site && cd site
          K="$GITHUB_WORKSPACE/skills/website-contact-form/templates"
          mkdir -p public/js
          cp "$K/mail-form.js" public/js/ && cp "$K/MailForm.astro" "$K/mail-form-text.ts" src/components/ && cp "$K/mail-form.spec.ts" tests/
          sed -i "s|^const PAGE = '';|const PAGE = '/';|; s|^const TO = '';|const TO = 'hello@example.com';|; s|^const SUBJECT = '';|const SUBJECT = 'Project enquiry';|; s|^const GREETING = '';|const GREETING = 'Dear Ms Smith,';|" tests/mail-form.spec.ts
          # The German form: a German page on an English site, with no lang of its own: it
          # takes the page's, which Base.astro hands down (§2 step 3).
          cp "$K/mail-form.spec.ts" tests/mail-form.de.spec.ts
          sed -i "s|^const PAGE = '';|const PAGE = '/impressum';|; s|^const TO = '';|const TO = 'hello@example.com';|; s|^const SUBJECT = '';|const SUBJECT = 'Anfrage Bauvorhaben';|; s|^const GREETING = '';|const GREETING = 'Sehr geehrte Frau Muster,';|; s|^const ADDED: string\[\] = \[\];|const ADDED: string[] = ['Ein neues Projekt', 'Ort'];|" tests/mail-form.de.spec.ts
          sed -i "s|^import { SITE } from '../config';|import { SITE } from '../config';\nimport MailForm from '../components/MailForm.astro';|" src/pages/impressum.astro src/pages/index.astro
          # The German form with the skill's example: a choice, an optional field, a hint
          # that follows the choice (styled as the skill says, by the page).
          cat > form.de.astro <<'EOF'
            <section class="wrap"><h2>Kontakt</h2>
              <MailForm to="hello@example.com" subject="Anfrage Bauvorhaben" greeting="Sehr geehrte Frau Muster,">
                <fieldset>
                  <legend>Worum geht es? <span class="mail-form-optional">(optional)</span></legend>
                  <label><input type="radio" name="art" id="art-neu" value="neu" /> Ein neues Projekt</label>
                  <label><input type="radio" name="art" id="art-laufend" value="laufend" /> Ein laufendes Projekt</label>
                </fieldset>
                <p>
                  <label for="ort">Ort</label> <span class="mail-form-optional" id="ort-optional">(optional)</span>
                  <input id="ort" name="ort" type="text" maxlength="80" aria-describedby="ort-optional" />
                </p>
                <Fragment slot="hint"><span class="hint-any">Zum Beispiel: was geplant ist und wie weit.</span><span class="hint-neu">Zum Beispiel: was geplant ist und wann es losgehen soll.</span><span class="hint-laufend">Zum Beispiel: Stand des Projekts und was gebraucht wird.</span></Fragment>
              </MailForm>
            </section>
            <style>
              .hint-neu, .hint-laufend { display: none; }
              :global(.mail-form):has(#art-neu:checked, #art-laufend:checked) .hint-any { display: none; }
              :global(.mail-form):has(#art-neu:checked) .hint-neu { display: inline; }
              :global(.mail-form):has(#art-laufend:checked) .hint-laufend { display: inline; }
            </style>
          EOF
          awk 'FNR==NR { form = form $0 "\n"; next } /^<\/Base>/ { printf "%s", form } { print }' form.de.astro src/pages/impressum.astro > impressum.astro.new
          mv impressum.astro.new src/pages/impressum.astro && rm form.de.astro
          # The page's own spec, as the skill's "Adding fields" shows it, in German.
          cat > tests/kontakt.de.spec.ts <<'EOF'
          import { test, expect, type Page } from '@playwright/test';
          import { TEXT } from '../src/components/mail-form-text';

          const t = TEXT.de;
          const greeting = 'Sehr geehrte Frau Muster,';
          const form = (page: Page) => page.locator('form[data-mail-form]');
          async function send(page: Page) {
            const asked = page.waitForRequest((r) => r.url().startsWith('mailto:'), { timeout: 5000 });
            await form(page).getByRole('button', { name: t.send, exact: true }).click();
            const body = (await asked).url().split('?')[1].split('&').find((p) => p.startsWith('body='))!;
            return decodeURIComponent(body.slice('body='.length));
          }

          test('kontakt — the choice and the place arrive under the message', async ({ page }) => {
            await page.goto('/impressum');
            await form(page).getByLabel('Ein laufendes Projekt', { exact: true }).check();
            await form(page).getByLabel('Ort', { exact: true }).fill('München');
            await form(page).getByLabel(t.message, { exact: true }).fill('Eine Bauleitung ab März.');
            expect(await send(page)).toBe(`${greeting}\r\n\r\nEine Bauleitung ab März.\r\n\r\nEin laufendes Projekt\r\nOrt: München\r\n\r\n${t.signoff}`);
          });

          test('kontakt — with nothing chosen or added, the mail has no field line', async ({ page }) => {
            await page.goto('/impressum');
            await expect(form(page).locator('input[type=radio]:checked')).toHaveCount(0);
            await form(page).getByLabel(t.message, { exact: true }).fill('Eine kurze Frage.');
            expect(await send(page)).toBe(`${greeting}\r\n\r\nEine kurze Frage.\r\n\r\n${t.signoff}`);
          });

          test('kontakt — the hint follows the choice and is the description of the message box', async ({ page }) => {
            await page.goto('/impressum');
            const box = form(page).getByLabel(t.message, { exact: true });
            await expect(box).toHaveAccessibleDescription('Zum Beispiel: was geplant ist und wie weit.');
            await form(page).getByLabel('Ein neues Projekt', { exact: true }).check();
            await expect(box).toHaveAccessibleDescription('Zum Beispiel: was geplant ist und wann es losgehen soll.');
            await form(page).getByLabel('Ein laufendes Projekt', { exact: true }).check();
            await expect(box).toHaveAccessibleDescription('Zum Beispiel: Stand des Projekts und was gebraucht wird.');
          });

          test('kontakt — a field in the slot takes the form\'s look', async ({ page }) => {
            await page.goto('/impressum');
            const place = form(page).getByLabel('Ort', { exact: true });
            const message = form(page).getByLabel(t.message, { exact: true });
            for (const property of ['border-top-style', 'border-radius', 'display']) {
              expect(await place.evaluate((e, p) => getComputedStyle(e).getPropertyValue(p), property), property)
                .toBe(await message.evaluate((e, p) => getComputedStyle(e).getPropertyValue(p), property));
            }
          });
          EOF
          sed -i 's|^</Base>|  <section class="wrap"><h2>Contact</h2><MailForm to="hello@example.com" subject="Project enquiry" greeting="Dear Ms Smith," /></section>\n</Base>|' src/pages/index.astro
          # One check per line: in "a && b" a failing a does not stop the step.
          grep -q "const PAGE = '/';" tests/mail-form.spec.ts
          grep -q "const TO = 'hello@example.com';" tests/mail-form.spec.ts
          grep -q "const SUBJECT = 'Project enquiry';" tests/mail-form.spec.ts
          grep -q "const PAGE = '/impressum';" tests/mail-form.de.spec.ts
          grep -q "const TO = 'hello@example.com';" tests/mail-form.de.spec.ts
          grep -q "const SUBJECT = 'Anfrage Bauvorhaben';" tests/mail-form.de.spec.ts
          grep -q "const GREETING = 'Dear Ms Smith,';" tests/mail-form.spec.ts
          grep -q "const GREETING = 'Sehr geehrte Frau Muster,';" tests/mail-form.de.spec.ts
          grep -q "const greeting = 'Sehr geehrte Frau Muster,';" tests/kontakt.de.spec.ts
          grep -qF "const ADDED: string[] = ['Ein neues Projekt', 'Ort'];" tests/mail-form.de.spec.ts
          grep -q '<MailForm to="hello@example.com" subject="Project enquiry" greeting="Dear Ms Smith," />' src/pages/index.astro
          grep -q 'import MailForm' src/pages/index.astro
          grep -q '<MailForm to="hello@example.com" subject="Anfrage Bauvorhaben" greeting="Sehr geehrte Frau Muster,">' src/pages/impressum.astro
          grep -q 'id="ort" name="ort"' src/pages/impressum.astro
          grep -q "import { TEXT } from '../src/components/mail-form-text';" tests/kontakt.de.spec.ts
          grep -q 'import MailForm' src/pages/impressum.astro
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Type check and the whole suite, with the form in place
        working-directory: ${{ runner.temp }}/site
        run: |
          npm run check
          npm test
      # A form without its subject or its greeting, without a language, or in a
      # language it has no words for, must stop the build, not go out with a generic
      # subject or greeting, or in English. Last step: it leaves the site broken on purpose.
      - name: A form without a subject, without a greeting, without a language, or in a language with no texts, stops the build
        working-directory: ${{ runner.temp }}/site
        run: |
          cp src/pages/index.astro index.astro.keep
          sed -i 's|<MailForm to="hello@example.com" subject="Project enquiry" greeting="Dear Ms Smith," />|<MailForm to="hello@example.com" greeting="Dear Ms Smith," />|' src/pages/index.astro
          grep -q '<MailForm to="hello@example.com" greeting="Dear Ms Smith," />' src/pages/index.astro
          if npm run build > build.log 2>&1; then cat build.log; echo '::error::a form without a subject was built'; exit 1; fi
          grep -qF 'MailForm: pass subject="…"' build.log || { cat build.log; echo '::error::the build failed, but not on the missing subject'; exit 1; }
          cp index.astro.keep src/pages/index.astro
          # A form without its greeting.
          sed -i 's|<MailForm to="hello@example.com" subject="Project enquiry" greeting="Dear Ms Smith," />|<MailForm to="hello@example.com" subject="Project enquiry" />|' src/pages/index.astro
          grep -q '<MailForm to="hello@example.com" subject="Project enquiry" />' src/pages/index.astro
          if npm run build > build.log 2>&1; then cat build.log; echo '::error::a form without a greeting was built'; exit 1; fi
          grep -qF 'MailForm: pass greeting="…"' build.log || { cat build.log; echo '::error::the build failed, but not on the missing greeting'; exit 1; }
          cp index.astro.keep src/pages/index.astro
          # A page whose language never reaches the form (a Base.astro from an older starter).
          cp src/layouts/Base.astro Base.astro.keep
          sed -i 's|^Astro.locals.lang = lang;$||' src/layouts/Base.astro
          if grep -q '^Astro.locals.lang = lang;$' src/layouts/Base.astro; then echo '::error::the Base.astro line was not removed'; exit 1; fi
          if npm run build > build.log 2>&1; then cat build.log; echo '::error::a form with no language was built'; exit 1; fi
          grep -qF 'MailForm: no language for this page' build.log || { cat build.log; echo '::error::the build failed, but not on the missing language'; exit 1; }
          cp Base.astro.keep src/layouts/Base.astro
          sed -i 's|<MailForm to="hello@example.com" subject="Project enquiry" greeting="Dear Ms Smith," />|<MailForm to="hello@example.com" subject="Project enquiry" greeting="Dear Ms Smith," lang="xx" />|' src/pages/index.astro
          grep -q 'lang="xx"' src/pages/index.astro
          if npm run build > build.log 2>&1; then cat build.log; echo '::error::a form in a language with no texts was built'; exit 1; fi
          grep -q 'MailForm: no texts for the language "xx"' build.log || { cat build.log; echo '::error::the build failed, but not on the missing texts'; exit 1; }

  # website-brand-kit puts colours and icons into a site and then runs the site's own
  # `npm run build && npm test`. Its other tests (clean.yml, website-brand-kit-tests) stand
  # a command in for those; this job is the one run that uses the real ones: green before,
  # the install, green after, and the built site serving the new mark and colours. A starter
  # change that the intake's edits no longer fit (global.css's three colour blocks, config.ts,
  # the manifest, the share-card generator) turns red here.
  brand-kit-skill:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: skills/new-website/templates/astro/.nvmrc
          check-latest: true  # a cached older Node of that major is not enough: engines needs its security release
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: A site from the starter, installed, with Playwright's browser and Pillow
        working-directory: ${{ runner.temp }}
        run: |
          cp -R "$GITHUB_WORKSPACE/skills/new-website/templates/astro" site
          cp "$GITHUB_WORKSPACE/skills/new-website/templates/.gitignore" site/.gitignore
          cd site
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          python -m pip install Pillow
      - name: Green before, the palette and the logo go in, green after, by the site's own tests
        working-directory: .
        shell: bash   # named, so the step runs with pipefail: a failing test run is not hidden by tee
        env:
          BRAND_KIT_E2E_SITE: ${{ runner.temp }}/site
          BRAND_KIT_NODE_MODULES: ${{ runner.temp }}/site/node_modules
          REQUIRE_SHARP: "1"
        run: |
          python -m unittest discover -v -s skills/website-brand-kit/scripts/tests -p 'test_e2e_site.py' 2>&1 | tee e2e.log
          # One check per line. A skipped test is not a pass: the run must name it "ok".
          grep -q 'test_scenario_8_.* ok$' e2e.log

  # The website-tagline skill ships one test that lives in a SITE, never in the starter,
  # so the jobs above do not run it. This builds a site from the starter and shows a
  # tagline on its home page. The starter has no header, so the line sits under the
  # page's <h1>: the test checks the element it is pointed at, wherever that is. The
  # test then runs three ways: unconfigured (every test must sit out), on a correct site
  # (green, with the whole suite), and on each mistake the test exists for (red, in the
  # test that names the mistake). The edits use perl, not sed -i, so the same lines run
  # unchanged on a Mac; \x27 is an apostrophe inside a single-quoted perl program.
  tagline-skill:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: skills/new-website/templates/astro/.nvmrc
          check-latest: true  # a cached older Node of that major is not enough: engines needs its security release
      - name: A site from the starter, with the test copied in and not configured
        working-directory: ${{ runner.temp }}
        run: |
          cp -R "$GITHUB_WORKSPACE/skills/new-website/templates/astro" site && cd site
          cp "$GITHUB_WORKSPACE/skills/website-tagline/templates/tagline.spec.ts" tests/
          # The test knows the starter's placeholder by heart. If the starter's value
          # changes and the test's copy does not, the test would call a site with no
          # tagline fine, so the two are compared here.
          placeholder="$(sed -n "s/^ *tagline: '\(.*\)',\$/\1/p" src/config.ts)"
          [ -n "$placeholder" ] || { echo "::error::no tagline value found in the starter's src/config.ts"; exit 1; }
          grep -Fq "const PLACEHOLDER = '$placeholder';" tests/tagline.spec.ts || { echo "::error::the starter ships tagline '$placeholder'; tagline.spec.ts expects another placeholder"; exit 1; }
          # The later steps take the value from here, so this job holds no third copy of it.
          printf '%s' "$placeholder" > "$RUNNER_TEMP/placeholder"
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          # An unconfigured copy reports "not applicable": nothing passes, nothing fails.
          out="$(CI= npx playwright test tests/tagline.spec.ts --reporter=line 2>&1)" || { printf '%s\n' "$out"; echo "::error::the unconfigured test did not exit 0"; exit 1; }
          printf '%s\n' "$out" | tail -n 4
          printf '%s\n' "$out" | grep -Eq '^ +[0-9]+ skipped' || { echo "::error::no test was skipped"; exit 1; }
          if printf '%s\n' "$out" | grep -Eq '^ +[0-9]+ (passed|failed)'; then echo "::error::an unconfigured test passed or failed instead of sitting out"; exit 1; fi
      - name: The site shows a tagline that reads SITE.tagline; the test and the whole suite are green
        working-directory: ${{ runner.temp }}/site
        run: |
          perl -pi -e "s|selector: '',|selector: '.tagline',|" tests/tagline.spec.ts
          PLACEHOLDER="$(cat "$RUNNER_TEMP/placeholder")" perl -pi -e 's|tagline: \x27\Q$ENV{PLACEHOLDER}\E\x27,|tagline: \x27Your books done. Your evenings back.\x27,|' src/config.ts
          # The two comment lines are decoys: the line inside a longer word is not a second
          # copy, so the "typed once" test has to stay green with them in the file. The
          # second is bordered by a digit and a letter from outside the basic plane, which
          # take two places each in a string.
          perl -pi -e 's|^(\s*)<h1>\{SITE\.name\}</h1>|$1<h1>{SITE.name}</h1>\n$1<!-- xYour books done. Your evenings back.x -->\n$1<!-- 𝟙Your books done. Your evenings back.𐐀 -->\n$1<p class="tagline">{SITE.tagline}</p>|' src/pages/index.astro
          # One check per line: in "a && b" a failing a does not stop the step.
          grep -q "selector: '.tagline'," tests/tagline.spec.ts
          grep -q "tagline: 'Your books done. Your evenings back.'," src/config.ts
          grep -q '<p class="tagline">{SITE.tagline}</p>' src/pages/index.astro
          grep -q 'xYour books done. Your evenings back.x' src/pages/index.astro
          grep -q '𝟙Your books done. Your evenings back.𐐀' src/pages/index.astro
          cp src/pages/index.astro "$RUNNER_TEMP/index.good" && cp src/config.ts "$RUNNER_TEMP/config.good"
          npm run check
          npm test
          out="$(CI= npx playwright test tests/tagline.spec.ts --reporter=line 2>&1)" || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out" | grep -Eq '^ +4 passed' || { printf '%s\n' "$out"; echo "::error::the four tagline tests did not all pass"; exit 1; }
      # A guard that cannot fail guards nothing. Each case makes one mistake on the good
      # site and must turn exactly one test red: the one whose name says what is wrong.
      - name: Each mistake turns its own test red
        working-directory: ${{ runner.temp }}/site
        run: |
          # The reporter prints every test's name as it runs, passed or not. Only its
          # numbered list of failures ("  1) [chromium] › tests/...") says which one failed.
          failed_test_is() { printf '%s\n' "$1" | grep -E '^ +[0-9]+\) ' | grep -Fq "$2"; }
          red() {   # red "<what was done>" "<part of the failing test's name>" ["<part of its message>"]
            if out="$(CI= npx playwright test tests/tagline.spec.ts --reporter=line 2>&1)"; then
              printf '%s\n' "$out" | tail -n 6; echo "::error::$1: the test stayed green"; exit 1
            fi
            printf '%s\n' "$out" | grep -Eq '^ +1 failed' || { printf '%s\n' "$out" | tail -n 30; echo "::error::$1: not exactly one test failed"; exit 1; }
            failed_test_is "$out" "$2" || { printf '%s\n' "$out" | tail -n 30; echo "::error::$1: the failing test is not \"$2\""; exit 1; }
            if [ -n "${3:-}" ]; then
              printf '%s\n' "$out" | grep -Fq "$3" || { printf '%s\n' "$out" | tail -n 30; echo "::error::$1: the failure does not say \"$3\""; exit 1; }
            fi
            echo "red as expected ($2${3:+; $3}): $1"
            last="$out"
            cp "$RUNNER_TEMP/index.good" src/pages/index.astro && cp "$RUNNER_TEMP/config.good" src/config.ts
          }
          perl -pi -e 's|\{SITE\.tagline\}</p>|Your books done. Your evenings back.</p>|' src/pages/index.astro
          grep -q '<p class="tagline">Your books done. Your evenings back.</p>' src/pages/index.astro
          red "the line typed into the page as well" "the line is typed once"
          # The name check itself, on that same run: it must refuse a test that passed.
          if failed_test_is "$last" "is a paragraph, not a heading"; then echo "::error::the name check accepts a test that did not fail"; exit 1; fi
          perl -pi -e 's|<p class="tagline">\{SITE\.tagline\}</p>|<h2 class="tagline">{SITE.tagline}</h2>|' src/pages/index.astro
          grep -q '<h2 class="tagline">' src/pages/index.astro
          red "the line set as a heading" "is a paragraph, not a heading"
          perl -pi -e 's|\{SITE\.tagline\}</p>|Your books done.</p>|' src/pages/index.astro
          grep -q '<p class="tagline">Your books done.</p>' src/pages/index.astro
          red "another line on the page than in the config" "is SITE.tagline, word for word"
          perl -pi -e 's|^(\s*)(<p class="tagline">\{SITE\.tagline\}</p>)|$1$2\n$1$2|' src/pages/index.astro
          [ "$(grep -c '<p class="tagline">{SITE.tagline}</p>' src/pages/index.astro)" = 2 ]
          red "the line shown twice" "is SITE.tagline, word for word"
          # A copy written with an escaped apostrophe: the page shows the right line, and
          # the source holds it a second time in a form a plain search would miss.
          perl -pi -e 's|tagline: \x27Your books done. Your evenings back.\x27,|tagline: "Freelancers\x27 evenings back.",|' src/config.ts
          grep -q "tagline: \"Freelancers' evenings back.\"," src/config.ts
          perl -pi -e 's|^(import \{ SITE \} from \x27\.\./config\x27;)|$1\nconst again = \x27Freelancers\\\x27 evenings back.\x27;|; s|\{SITE\.tagline\}</p>|{again}</p>|' src/pages/index.astro
          grep -Fq "const again = 'Freelancers\\' evenings back.';" src/pages/index.astro
          grep -q '<p class="tagline">{again}</p>' src/pages/index.astro
          red "the line typed again with an escaped apostrophe" "the line is typed once"
          # The same, with the apostrophe as a character reference in the page, in a
          # spelling with leading zeros that only a full decoder reads.
          perl -pi -e 's|tagline: \x27Your books done. Your evenings back.\x27,|tagline: "Freelancers\x27 evenings back.",|' src/config.ts
          grep -q "tagline: \"Freelancers' evenings back.\"," src/config.ts
          perl -pi -e 's|\{SITE\.tagline\}</p>|Freelancers&#00000039; evenings back.</p>|' src/pages/index.astro
          grep -q '<p class="tagline">Freelancers&#00000039; evenings back.</p>' src/pages/index.astro
          red "the line typed again with a character reference" "the line is typed once"
          PLACEHOLDER="$(cat "$RUNNER_TEMP/placeholder")" perl -pi -e 's|tagline: \x27Your books done. Your evenings back.\x27,|tagline: \x27$ENV{PLACEHOLDER}\x27,|' src/config.ts
          grep -Fq "tagline: '$(cat "$RUNNER_TEMP/placeholder")'," src/config.ts
          red "the starter's placeholder left in the config" "is a real line within the limits" "placeholder"
          # Nine words in 31 characters, then six words in 67: each limit on its own.
          perl -pi -e "s|tagline: 'Your books done. Your evenings back.',|tagline: 'We do it so you can get on now.',|" src/config.ts
          grep -q "tagline: 'We do it so you can get on now.'," src/config.ts
          red "a line of nine short words" "is a real line within the limits" "has 9 words"
          perl -pi -e "s|tagline: 'Your books done. Your evenings back.',|tagline: 'Uncomplicated bookkeeping for independent professionals everywhere.',|" src/config.ts
          grep -q "professionals everywhere.'," src/config.ts
          red "a line of six long words" "is a real line within the limits" "has 67 characters"

  # The website-hero-carousel skill ships files that live in a SITE, like the contact form. This
  # builds a site from the starter, installs the skill the way its SKILL.md §2 says (the
  # component, its words, the script, the test, the carousel on the home page with three
  # generated photos: one pale, one dark, one in 4:3, two of them linked), and runs the type
  # check and the whole suite. Three runs, so that every setting and the pairing the mid-fade
  # assertions need are run: (button, instant), (dots, fade) and (button, fade). The photos are
  # made here, not committed: the pale one is the worst case for white dots, so the contrast
  # test can never pass only because the fixture was dark. Last step: a carousel that is
  # missing something must stop the build.
  hero-carousel-skill:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: skills/new-website/templates/astro/.nvmrc
          check-latest: true  # a cached older Node of that major is not enough: engines needs its security release
      - name: A site from the starter
        working-directory: ${{ runner.temp }}
        run: |
          cp -R "$GITHUB_WORKSPACE/skills/new-website/templates/astro" site && cd site
          cp src/pages/index.astro "$RUNNER_TEMP/index.pristine.astro"
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          # three generated photos, not committed
          mkdir -p src/assets
          node --input-type=module -e "
          import sharp from 'sharp';
          const mk = (name, rgb, h = 1350) => sharp({ create: { width: 2400, height: h, channels: 3, background: rgb } }).jpeg({ quality: 80 }).toFile('src/assets/' + name);
          await mk('hc-pale.jpg', { r: 244, g: 244, b: 240 });
          await mk('hc-dark.jpg', { r: 24, g: 32, b: 40 });
          await mk('hc-mid.jpg', { r: 120, g: 140, b: 130 }, 1800);
          "
      - name: The skill installed, three times, each with the type check and the whole suite
        working-directory: ${{ runner.temp }}/site
        run: |
          K="$GITHUB_WORKSPACE/skills/website-hero-carousel/templates"
          for cfg in "button instant" "dots fade" "button fade"; do
            set -- $cfg; PAUSE=$1; SWAP=$2
            echo "::group::pause $PAUSE, swap $SWAP"
            rm -f tests/hero-carousel.spec.ts public/js/hero-carousel.js src/components/HeroCarousel.astro src/components/hero-carousel-text.ts
            cp "$RUNNER_TEMP/index.pristine.astro" src/pages/index.astro
            mkdir -p public/js
            cp "$K/hero-carousel.js" public/js/ && cp "$K/HeroCarousel.astro" "$K/hero-carousel-text.ts" src/components/ && cp "$K/hero-carousel.spec.ts" tests/
            sed -i "s|^const PAGE: string = '';|const PAGE: string = '/';|; s|^const PAUSE: string = '';|const PAUSE: string = '$PAUSE';|; s|^const SWAP: string = '';|const SWAP: string = '$SWAP';|" tests/hero-carousel.spec.ts
            # One check per line: in "a && b" a failing a does not stop the step.
            grep -q "const PAGE: string = '/';" tests/hero-carousel.spec.ts
            grep -q "const PAUSE: string = '$PAUSE';" tests/hero-carousel.spec.ts
            grep -q "const SWAP: string = '$SWAP';" tests/hero-carousel.spec.ts
            sed -i "s|^import { SITE } from '../config';|import { SITE } from '../config';\nimport HeroCarousel from '../components/HeroCarousel.astro';\nimport pale from '../assets/hc-pale.jpg';\nimport dark from '../assets/hc-dark.jpg';\nimport mid from '../assets/hc-mid.jpg';|" src/pages/index.astro
            sed -i "s|^<Base title={SITE.name}>|<Base title={SITE.name}>\n<HeroCarousel label=\"Photos of our work\" pause=\"$PAUSE\" swap=\"$SWAP\" slides={[{ image: pale, alt: 'A pale wall in daylight, seen straight on', label: 'Pale wall', href: '/privacy' }, { image: dark, alt: 'A dark room with no light on', label: 'Dark room', href: '/impressum' }, { image: mid, alt: 'A green-grey field under an even sky', label: 'Field' }]} />|" src/pages/index.astro
            grep -q '<HeroCarousel ' src/pages/index.astro
            grep -q 'import HeroCarousel' src/pages/index.astro
            npm run check
            npm test
            echo "::endgroup::"
          done
      # A carousel with one slide, without a label, without alt text, with a setting it does not
      # know, or in a language it has no words for, must stop the build, not go out wrong.
      # Last step: it leaves the site broken on purpose.
      - name: A carousel that is missing something stops the build
        working-directory: ${{ runner.temp }}/site
        run: |
          stops() { # $1 what was broken, $2 the sed that breaks it, $3 the message the build must give
            cp "$RUNNER_TEMP/index.broken-base.astro" src/pages/index.astro
            sed -i "$2" src/pages/index.astro
            if cmp -s src/pages/index.astro "$RUNNER_TEMP/index.broken-base.astro"; then echo "::error::$1: the sed changed nothing"; exit 1; fi
            if npm run build > build.log 2>&1; then cat build.log; echo "::error::$1: it was built"; exit 1; fi
            grep -qF "$3" build.log || { cat build.log; echo "::error::$1: the build failed, but not on: $3"; exit 1; }
          }
          # the page with a working two-slide carousel, which each case then breaks
          cp "$RUNNER_TEMP/index.pristine.astro" "$RUNNER_TEMP/index.broken-base.astro"
          K="$GITHUB_WORKSPACE/skills/website-hero-carousel/templates"
          cp "$K/HeroCarousel.astro" src/components/
          cp "$K/hero-carousel-text.ts" src/components/
          sed -i "s|^import { SITE } from '../config';|import { SITE } from '../config';\nimport HeroCarousel from '../components/HeroCarousel.astro';\nimport pale from '../assets/hc-pale.jpg';\nimport dark from '../assets/hc-dark.jpg';|" "$RUNNER_TEMP/index.broken-base.astro"
          sed -i "s|^<Base title={SITE.name}>|<Base title={SITE.name}>\n<HeroCarousel label=\"Photos\" slides={[{ image: pale, alt: 'A pale wall in daylight, seen straight on', label: 'Pale wall' }, { image: dark, alt: 'A dark room with no light on', label: 'Dark room' }]} />|" "$RUNNER_TEMP/index.broken-base.astro"
          stops "one slide" "s|, { image: dark, alt: 'A dark room with no light on', label: 'Dark room' }||" 'HeroCarousel: pass slides'
          stops "no label" 's|label="Photos" ||' 'HeroCarousel: pass label'
          stops "alt text missing" "s|alt: 'A pale wall in daylight, seen straight on'|alt: ''|" 'has no alt text of its own'
          stops "a dot without a name" "s|, label: 'Dark room'||" 'has no label'
          stops "an unknown pause setting" 's|label="Photos" |label="Photos" pause="never" |' 'pause is "button" or "dots"'
          stops "an unknown swap setting" 's|label="Photos" |label="Photos" swap="slide" |' 'swap is "instant" or "fade"'
          stops "an interval too short" 's|label="Photos" |label="Photos" intervalMs={500} |' 'intervalMs below 2000'
          stops "a language with no texts" 's|label="Photos" |label="Photos" lang="xx" |' 'no texts for the language "xx"'

  # tests/phone-images.spec.ts ships in the starter, which renders no raster image, so the
  # starter suite alone proves nothing about it. This job adds a block of generated noise WebP
  # images to the home page (noise, so an oversized file is well over the 4 KiB floor) holding
  # every case the test must pass, runs the test and the whole suite, then makes one mistake
  # at a time and checks that this test, and only this test, turns red and says why.
  phone-images-test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: skills/new-website/templates/astro/.nvmrc
          check-latest: true  # a cached older Node of that major is not enough: engines needs its security release
      - name: A site from the starter, with images for every case the test must pass
        working-directory: ${{ runner.temp }}
        run: |
          cp -R "$GITHUB_WORKSPACE/skills/new-website/templates/astro" site && cd site
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          # sharp comes with Astro (the hero-carousel job makes its photos the same way)
          mkdir -p public/fx
          node --input-type=module -e "
          import sharp from 'sharp';
          const noise = (name, w, h) => sharp({ create: { width: w, height: h, channels: 3, background: '#808080', noise: { type: 'gaussian', mean: 128, sigma: 60 } } }).webp({ quality: 80 }).toFile('public/fx/' + name);
          const flat = (name, w, h) => sharp({ create: { width: w, height: h, channels: 3, background: '#4a6' } }).webp({ quality: 80 }).toFile('public/fx/' + name);
          for (const n of ['right', 'swap', 'zero', 'layer1', 'layer2', 'desk', 'orphan', 'ghost', 'paren(1)', 'set1', 'set2', 'vis', 'calc', 'sd', 'none', 'mask', 'poster', 'border']) await noise(n + '.webp', 600, 400);
          await noise('list.webp', 40, 40);
          await noise('big.webp', 2000, 1333);
          await noise('cover.webp', 1200, 800);
          await noise('tile.webp', 2000, 2000);
          await flat('flat.webp', 1000, 667);
          await flat('hidden.webp', 600, 400);
          "
          ls -l public/fx
          # The two small files must stay under the floor, or the cases that use them prove nothing.
          for f in flat hidden; do [ "$(wc -c < "public/fx/$f.webp")" -lt 4096 ] || { echo "::error::$f.webp is not under 4 KiB"; exit 1; }; done
          [ "$(wc -c < public/fx/zero.webp)" -gt 4096 ] || { echo "::error::zero.webp is not over 4 KiB"; exit 1; }
          [ "$(wc -c < public/fx/big.webp)" -gt 100000 ] || { echo "::error::big.webp is too small to be over the floor"; exit 1; }
          # The green page, one block before </Base>: every case the test must pass. The page is long
          # (smooth scrolling must not leave the end unseen) and grows 400 ms after its end is reached.
          perl -0pi -e 's|</Base>|  <link slot="head" rel="preload" as="image" href="/fx/swap.webp" />
            <link slot="head" rel="preload" as="image" href="/fx/desk.webp" media="(min-width: 720px)" />
            <link slot="head" rel="preload" as="image" imagesrcset="/fx/desk.webp 600w" imagesizes="200px" media="(min-width: 720px)" />
            <style>
              .fx-cover { width: 200px; height: 400px; background: linear-gradient(#0003, #0003), url(/fx/cover.webp) center / cover no-repeat; }
              .fx-layers { width: 200px; height: 133px; background-image: url(/fx/layer1.webp), url(/fx/layer2.webp); background-size: 100% auto, 100% auto; background-repeat: no-repeat; }
              .fx-paren { width: 200px; height: 133px; background: url("/fx/paren(1).webp") center / 100% auto no-repeat; }
              .fx-set { width: 200px; height: 133px; background-image: image-set(url(/fx/set1.webp) 1x, url(/fx/set2.webp) 2x); background-size: 100% auto; background-repeat: no-repeat; }
              .fx-calc { width: 200px; height: 133px; background: url(/fx/calc.webp) center / calc(100% - 10px) auto no-repeat; }
              .fx-tile { width: 200px; height: 200px; background: url(/fx/tile.webp) repeat; }
              .fx-mask { width: 200px; height: 133px; background: #4a6; mask: url(/fx/mask.webp) center / 100% auto no-repeat; }
              .fx-list { list-style-image: url(/fx/list.webp); }
              .fx-border { width: 200px; height: 50px; border: 10px solid; border-image: url(/fx/border.webp) 30; }
              .fx-spacer { height: 8000px; }
              .fx-pb::before { content: ""; display: block; width: 100px; height: 100px; background: url(/fx/right.webp) center / 100% no-repeat; }
            </style>
            <section class="wrap fx" data-grow="/fx/right.webp">
              <img id="fx-swap" src="/fx/swap.webp" alt="" width="600" height="400" loading="eager" style="width: 200px; height: auto" />
              <img id="fx-hidden" src="/fx/hidden.webp" alt="" width="600" height="400" loading="eager" style="width: 0; height: 0" />
              <img src="/fx/flat.webp" alt="" width="1000" height="667" loading="eager" style="width: 100px; height: auto" />
              <div class="fx-cover"></div>
              <div class="fx-layers"></div>
              <div class="fx-paren"></div>
              <div class="fx-set"></div>
              <div class="fx-calc"></div>
              <img src="/fx/calc.webp" alt="" width="600" height="400" loading="eager" style="width: 50px; height: auto" />
              <img id="fx-vis" src="/fx/vis.webp" alt="" width="600" height="400" loading="eager" style="width: 200px; height: auto" />
              <img id="fx-sd" src="/fx/sd.webp" alt="" width="600" height="400" loading="eager" style="width: 200px; height: 133px; object-fit: scale-down" />
              <img src="/fx/none.webp" alt="" width="600" height="400" loading="eager" style="width: 200px; height: 133px; object-fit: none" />
              <video poster="/fx/poster.webp" style="width: 100px; height: 400px; object-fit: cover"></video>
              <div class="fx-mask"></div>
              <ul class="fx-list"><li>A list item</li></ul>
              <div class="fx-border"></div>
              <div class="fx-tile"></div>
              <div class="fx-pb"></div>
              <div class="fx-spacer"></div>
              <img id="fx-low" src="/fx/right.webp" alt="" width="600" height="400" loading="lazy" style="width: 200px; height: auto" />
            </section>
            <script is:inline>
              addEventListener("scroll", () => { document.getElementById("fx-swap").src = "/fx/right.webp"; }, { once: true });
              const fxGrow = () => {
                if (scrollY + innerHeight < document.documentElement.scrollHeight - 50) return;
                removeEventListener("scroll", fxGrow);
                setTimeout(() => {
                const s = document.querySelector(".fx");
                const gap = document.createElement("div"); gap.style.height = "8000px";
                const img = Object.assign(document.createElement("img"), { src: s.dataset.grow, alt: "", width: 600, height: 400, loading: "lazy" });
                img.style.width = "200px"; img.style.height = "auto";
                s.append(gap, img);
                }, 400);
              };
              addEventListener("scroll", fxGrow);
            </script>
          </Base>|' src/pages/index.astro
          grep -q 'id="fx-low"' src/pages/index.astro
          cp src/pages/index.astro "$RUNNER_TEMP/index.good"
      - name: Green, the test alone and then the whole suite
        working-directory: ${{ runner.temp }}/site
        run: |
          out="$(CI= npx playwright test tests/phone-images.spec.ts --reporter=line 2>&1)" || { printf '%s\n' "$out" | tail -n 40; echo "::error::the green page failed phone-images.spec.ts"; exit 1; }
          line="$(grep -F 'phone images — /:' <<<"$out")" || { printf '%s\n' "$out" | tail -n 40; echo "::error::the home page printed no count"; exit 1; }
          printf '%s\n' "$line"
          # Sixteen files judged by width on / (calc, scale-down, none, mask, list marker and poster
          # among them); the small hidden one and the border image named, and nothing else.
          [[ $line == *'phone images — /: 16 judged by width; hidden and under 4 KiB: /fx/hidden.webp; not judged: /fx/border.webp (border-image-source)' ]] || { echo "::error::expected 16 judged by width on /, hidden.webp under 4 KiB and border.webp not judged, nothing else"; exit 1; }
          npm test
      - name: Each mistake turns this test red
        working-directory: ${{ runner.temp }}/site
        run: |
          failed_test_is() { local m; m="$(grep -E '^ +[0-9]+\) ' <<<"$1")" || return 1; [[ $m == *"$2"* ]]; }
          # edit "<perl>" "<text the page must then hold>": one change, proved to have landed.
          edit() { perl -pi -e "$1" src/pages/index.astro; grep -Fq "$2" src/pages/index.astro || { echo "::error::the edit to '$2' did not land"; exit 1; }; }
          red() {   # red "<what was done>" "<what the message must say>"
            if out="$(CI= npx playwright test tests/phone-images.spec.ts --reporter=line 2>&1)"; then
              printf '%s\n' "$out" | tail -n 6; echo "::error::$1: the test stayed green"; exit 1
            fi
            grep -Eq '^ +1 failed' <<<"$out" || { printf '%s\n' "$out" | tail -n 30; echo "::error::$1: not exactly one test failed"; exit 1; }
            failed_test_is "$out" "phone images — / downloads" || { printf '%s\n' "$out" | tail -n 30; echo "::error::$1: the failing test is not the home page's"; exit 1; }
            grep -Fq "$2" <<<"$out" || { printf '%s\n' "$out" | tail -n 30; echo "::error::$1: the failure does not say $2"; exit 1; }
            echo "red as expected ($2): $1"
            cp "$RUNNER_TEMP/index.good" src/pages/index.astro
          }
          # One change per case.
          edit 's|id="fx-low" src="/fx/right.webp"|id="fx-low" src="/fx/big.webp"|' 'id="fx-low" src="/fx/big.webp"'
          red "an oversized lazy image at the end of a long page" "/fx/big.webp is 2000px wide, shown at 200px"
          edit 's|data-grow="/fx/right.webp"|data-grow="/fx/big.webp"|' 'data-grow="/fx/big.webp"'
          red "an oversized image in content added late, once the end is reached" "/fx/big.webp is 2000px wide, shown at 200px"
          edit 's|removeEventListener\("scroll", fxGrow\);|/* grows at every end */|' '/* grows at every end */'
          red "a page that never stops growing" "/ did not settle at its end within 20 s"
          edit 's|background: url\(/fx/right.webp\) center / 100% no-repeat|background: url(/fx/big.webp) center / 100% no-repeat|' 'height: 100px; background: url(/fx/big.webp) center / 100% no-repeat'
          red "an oversized ::before background" "/fx/big.webp is 2000px wide, shown at 100px"
          edit 's|center / 100% auto no-repeat; \}|0 0 / 50px auto no-repeat; }|' 'url("/fx/paren(1).webp") 0 0 / 50px auto no-repeat'
          red "a background drawn at 50px by its background-size" "/fx/paren(1).webp is 600px wide, shown at 50px"
          edit 's|id="fx-hidden" src="/fx/hidden.webp"|id="fx-hidden" src="/fx/zero.webp"|' 'id="fx-hidden" src="/fx/zero.webp"'
          red "an image downloaded but hidden by its size" "/fx/zero.webp is downloaded but hidden at 412px"
          edit 's|(id="fx-vis" [^>]*style="width: 200px; height: auto)"|$1; visibility: hidden"|' 'height: auto; visibility: hidden"'
          red "an image downloaded but hidden by visibility" "/fx/vis.webp is downloaded but hidden at 412px"
          edit 's|(<link slot="head" rel="preload" as="image" href="/fx/swap.webp" />)|$1<link slot="head" rel="preload" as="image" href="/fx/orphan.webp" />|' 'href="/fx/orphan.webp"'
          red "an image preloaded and not shown" "/fx/orphan.webp is preloaded and downloaded"
          edit 's|^(\s*)(<script is:inline>)$|$1$2\n$1new Image().src = "/fx/ghost.webp";|' 'new Image().src = "/fx/ghost.webp";'
          red "an image a script loads and never shows" "/fx/ghost.webp was downloaded, but nothing on the page shows it"
          edit 's|(<link slot="head" rel="preload" as="image" href="/fx/swap.webp" />)|$1<link slot="head" rel="preload" as="image" imagesrcset="/fx/orphan.webp 600w" imagesizes="200px" />|' 'imagesrcset="/fx/orphan.webp 600w" imagesizes="200px" />'
          red "an image preloaded by imagesrcset and not shown" "/fx/orphan.webp is preloaded and downloaded"
          edit 's|id="fx-sd" src="/fx/sd.webp"|id="fx-sd" src="/fx/big.webp"|' 'id="fx-sd" src="/fx/big.webp"'
          red "an oversized image fitted by object-fit: scale-down" "/fx/big.webp is 2000px wide, shown at 200px"
          edit 's|url\(/fx/calc.webp\) center / calc|url(/fx/big.webp) center / calc|' 'url(/fx/big.webp) center / calc(100% - 10px)'
          red "an oversized background sized by calc()" "/fx/big.webp is 2000px wide, shown at 190px"
          edit 's|url\(/fx/calc.webp\) center / calc|url(/fx/big.webp) center / calc|; s|(\.fx-spacer \{)|:global(body > div:last-of-type > div) { max-width: 60px; padding: 0 30px; }\n              $1|' ':global(body > div:last-of-type > div) { max-width: 60px'
          red "the same, with site CSS that would squeeze the sizing probe" "/fx/big.webp is 2000px wide, shown at 190px"
          edit 's|url\(/fx/calc.webp\) center / calc|url(/fx/big.webp) center / calc|; s|\.fx-calc \{ width: 200px;|.fx-calc { width: 200px; border: 20px solid;|' '.fx-calc { width: 200px; border: 20px solid; height: 133px; background: url(/fx/big.webp)'
          red "the same on a bordered box: % sizes refer to the padding box" "/fx/big.webp is 2000px wide, shown at 150px"
          edit 's|mask: url\(/fx/mask.webp\)|mask: url(/fx/big.webp)|' 'mask: url(/fx/big.webp)'
          red "an oversized mask image" "/fx/big.webp is 2000px wide, shown at 200px"
          edit 's|<img src="/fx/none.webp"|<img src="/fx/big.webp"|' '<img src="/fx/big.webp" alt="" width="600" height="400" loading="eager" style="width: 200px; height: 133px; object-fit: none"'
          red "an oversized image cropped by object-fit: none" "/fx/big.webp is 2000px wide, shown at 200px"
          edit 's|; object-fit: cover"></video>|"></video>|' 'style="width: 100px; height: 400px"></video>'
          red "a poster drawn smaller once its video is not object-fit: cover" "/fx/poster.webp is 600px wide, shown at 100px"

  # The one check main's ruleset requires from this workflow. It passes when every job
  # above passed (the change touched their paths) or every job was skipped (it did not),
  # and fails on anything else: a failure, a cancel, a skip where a run was due.
  template-tests-ok:
    needs: [changes, playwright, prepare-any-shell, verify-windows, scorecard-skill, contact-form-skill, hero-carousel-skill, brand-kit-skill, tagline-skill, phone-images-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - working-directory: .
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          RESULTS: ${{ needs.playwright.result }} ${{ needs.prepare-any-shell.result }} ${{ needs.verify-windows.result }} ${{ needs.scorecard-skill.result }} ${{ needs.contact-form-skill.result }} ${{ needs.hero-carousel-skill.result }} ${{ needs.brand-kit-skill.result }} ${{ needs.tagline-skill.result }} ${{ needs.phone-images-test.result }}
        run: |
          echo "changes: $CHANGES, run: $RUN; playwright, prepare-any-shell, verify-windows, scorecard-skill, contact-form-skill, hero-carousel-skill, brand-kit-skill, tagline-skill, phone-images-test: $RESULTS"
          [ "$CHANGES" = success ] || { echo "::error::the changes job did not succeed"; exit 1; }
          case "$RUN" in
            true) want=success ;;
            false) want=skipped ;;
            *) echo "::error::the changes job gave run='$RUN', neither true nor false"; exit 1 ;;
          esac
          # one word per job named in RESULTS above (nine): a loop over the words would pass over an empty one unseen
          set -- $RESULTS
          [ "$#" -eq 9 ] || { echo "::error::expected 9 job results, got $#: '$RESULTS'"; exit 1; }
          for r in "$@"; do
            [ "$r" = "$want" ] || { echo "::error::a job ended '$r' where '$want' was due"; exit 1; }
          done
          echo "template tests: every job $want"
