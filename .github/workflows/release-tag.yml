name: release-tag
# Runs when a release tag is pushed and when the branch `stable` moves. The Claude Code
# plugin is installed from `stable`, which a release moves to its tag, and plugin.json's
# version is what tells Claude Code that there is an update. Nothing on a pull request can
# tell that a release forgot to raise that number, so plugin users would stay on the
# release before. Here the number is compared with the tag: the one pushed, or the one
# `stable` now points at, which also catches `stable` moved to a commit that is no release.
# It runs after the fact and stops nothing: a red run is the notice to put it right.
on:
  push:
    tags: ['v*']
    branches: [stable]

jobs:
  plugin-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # with tags: `stable` is checked against the tag on its commit
      - uses: actions/setup-node@v7
        with:
          node-version-file: skills/new-website/templates/astro/.nvmrc
      - name: Check that the plugin carries this release's number
        env:
          PUSHED: ${{ github.ref_type }}
          NAME: ${{ github.ref_name }}
        run: |
          if [ "$PUSHED" = tag ]; then
            tag="$NAME"
            # Only a release's tag (v0.32) carries a number to compare. Any other tag that
            # starts with v, a trial one say, is not this check's business.
            case "$tag" in
              v[0-9]*.[0-9]*) case "${tag#v}" in *[!0-9.]*|*.*.*) tag="" ;; esac ;;
              *) tag="" ;;
            esac
            [ -n "$tag" ] || { echo "::notice::$NAME is not a release tag like v0.32: nothing to check"; exit 0; }
          else
            tag="$(git tag --points-at HEAD --list 'v*')"
            case "$tag" in
              "")    echo "::error::stable was moved to a commit that carries no release tag"; exit 1 ;;
              *$'\n'*) echo "::error::the commit stable points at carries more than one release tag"; exit 1 ;;
            esac
          fi
          RELEASE_TAG="$tag" make test-plugin
