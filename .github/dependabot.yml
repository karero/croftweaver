version: 2
updates:
  # The Astro starter every new site is scaffolded from.
  - package-ecosystem: npm
    directory: /skills/new-website/templates/astro
    schedule:
      interval: weekly
    groups:
      astro-template-minor-and-patch:
        update-types: [minor, patch]
    # Same ignore rules as the starter's copy for sites, skills/new-website/templates/astro/.github/dependabot.yml; change them together.
    ignore:
      # Tracks the Node major in .nvmrc and ci.yml (engines stays at Astro's floor, >=22.23.4; the fixed versions for Node 24 and 26, 24.22.1 and 26.12.1, are advice in the docs (SETUP.md, the READMEs, UPGRADING.md), enforced nowhere, since Astro skips its own check there and npm only warns); bump them together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @astrojs/check 0.9.x peers typescript ^5 || ^6; lift this once it accepts 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /skills/search-console-insights
    # The file holds >= floors, which already admit every new release. Without this,
    # Dependabot raises each floor to the latest version, and those can drop Python 3.9
    # (macOS's stock python3) without the marker requirements.txt uses for requests.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly

  # This repo's workflows, plus the CI workflow the starter ships to every site.
  - package-ecosystem: github-actions
    directories:
      - /
      - /skills/new-website/templates/astro
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
